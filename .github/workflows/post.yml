name: LinkedIn Post Pipeline

on:
  # Sole scheduler. Runs pipeline.py directly on a GitHub-hosted runner —
  # scrape/pick-topic/diagram/post/git-push are plain Python, no LLM involved.
  # Only 3 Anthropic API calls happen per attempt (draft/humanize/quality-gate),
  # so tokens are spent purely on content generation, never on orchestration.
  # The Anthropic cloud routine (trig_01CdA8YWa1EAGbHtxVAi5KNx) and the local
  # launchd plist both run the pipeline through Claude Code's agentic loop
  # instead, which burns tokens on every mechanical step too — both are
  # disabled in favor of this workflow. Do not re-enable either without
  # disabling this cron first, to keep a single scheduler.
  schedule:
    - cron: '30 4 * * 1'  # Monday 10:00am IST (04:30 UTC) — GitHub repo topic
    - cron: '30 4 * * 5'  # Friday 10:00am IST — self-generated topic
  workflow_dispatch:      # manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-prod.txt anthropic

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_PERSON_ID: kdloWK9rIy
        run: python pipeline.py

      - name: Commit and push state
        run: |
          git config user.email "bot@linkedin-auto-posts"
          git config user.name "LinkedIn Bot"
          git add data/run_log.json data/posted_topics.json data/posts/ || true
          git commit -m "chore: update run state [skip ci]" || echo "nothing to commit"
          git push
